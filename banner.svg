<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <title>Turning Data Into Insight</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8cef0"/>
      <stop offset="50%" style="stop-color:#cddaf5"/>
      <stop offset="100%" style="stop-color:#dde8fb"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0bce8;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#c5d8f5;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <style>
    /* Phase 1: scramble 0-2s, Phase 2: gather 2-3.5s, Phase 3: wriggle forever 3.5s+ */

    .letter {
      font-family: Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #1a2a4a;
    }

    /* Each letter: start scattered, animate to final position, then wriggle */

    @keyframes l0 {
      0%   { transform: translate(-200px, -60px) rotate(-40deg); opacity:0.1; }
      15%  { opacity: 0.7; }
      55%  { transform: translate(2px, -5px) rotate(3deg); opacity:1; }
      65%  { transform: translate(-1px, 4px) rotate(-2deg); }
      75%  { transform: translate(0px, -3px) rotate(1deg); }
      /* wriggle forever from 75% */
      80%  { transform: translate(-2px, 5px) rotate(-2deg); }
      87%  { transform: translate(2px, -4px) rotate(3deg); }
      93%  { transform: translate(-1px, 3px) rotate(-1deg); }
      100% { transform: translate(1px, -2px) rotate(2deg); }
    }
    @keyframes l1 {
      0%   { transform: translate(220px, 70px) rotate(50deg); opacity:0.1; }
      15%  { opacity: 0.7; }
      55%  { transform: translate(-3px, 4px) rotate(-2deg); opacity:1; }
      65%  { transform: translate(2px, -5px) rotate(3deg); }
      75%  { transform: translate(-1px, 2px) rotate(-1deg); }
      80%  { transform: translate(3px, -4px) rotate(2deg); }
      87%  { transform: translate(-2px, 5px) rotate(-3deg); }
      93%  { transform: translate(1px, -3px) rotate(2deg); }
      100% { transform: translate(-2px, 4px) rotate(-2deg); }
    }
    @keyframes l2 {
      0%   { transform: translate(-150px, 80px) rotate(30deg); opacity:0.1; }
      18%  { opacity: 0.7; }
      57%  { transform: translate(4px, -3px) rotate(2deg); opacity:1; }
      67%  { transform: translate(-2px, 5px) rotate(-3deg); }
      77%  { transform: translate(1px, -2px) rotate(1deg); }
      82%  { transform: translate(-3px, 4px) rotate(-2deg); }
      89%  { transform: translate(2px, -5px) rotate(3deg); }
      95%  { transform: translate(-1px, 3px) rotate(-1deg); }
      100% { transform: translate(2px, -3px) rotate(2deg); }
    }
    @keyframes l3 {
      0%   { transform: translate(180px, -80px) rotate(-60deg); opacity:0.1; }
      20%  { opacity: 0.7; }
      58%  { transform: translate(-2px, 5px) rotate(-3deg); opacity:1; }
      68%  { transform: translate(3px, -4px) rotate(2deg); }
      78%  { transform: translate(-1px, 2px) rotate(-1deg); }
      83%  { transform: translate(4px, -3px) rotate(3deg); }
      90%  { transform: translate(-2px, 5px) rotate(-2deg); }
      96%  { transform: translate(1px, -4px) rotate(1deg); }
      100% { transform: translate(-3px, 3px) rotate(-2deg); }
    }
    @keyframes l4 {
      0%   { transform: translate(-250px, 50px) rotate(45deg); opacity:0.1; }
      22%  { opacity: 0.7; }
      59%  { transform: translate(3px, -4px) rotate(3deg); opacity:1; }
      69%  { transform: translate(-2px, 3px) rotate(-2deg); }
      79%  { transform: translate(2px, -2px) rotate(1deg); }
      84%  { transform: translate(-4px, 5px) rotate(-3deg); }
      91%  { transform: translate(2px, -3px) rotate(2deg); }
      97%  { transform: translate(-1px, 4px) rotate(-1deg); }
      100% { transform: translate(3px, -2px) rotate(2deg); }
    }
    @keyframes l5 {
      0%   { transform: translate(300px, 60px) rotate(-35deg); opacity:0.1; }
      10%  { opacity: 0.7; }
      56%  { transform: translate(-4px, 3px) rotate(-2deg); opacity:1; }
      66%  { transform: translate(3px, -5px) rotate(3deg); }
      76%  { transform: translate(-1px, 2px) rotate(-1deg); }
      81%  { transform: translate(5px, -4px) rotate(2deg); }
      88%  { transform: translate(-3px, 3px) rotate(-3deg); }
      94%  { transform: translate(2px, -2px) rotate(2deg); }
      100% { transform: translate(-2px, 4px) rotate(-1deg); }
    }
    @keyframes l6 {
      0%   { transform: translate(-100px, -90px) rotate(55deg); opacity:0.1; }
      12%  { opacity: 0.7; }
      57%  { transform: translate(2px, 5px) rotate(2deg); opacity:1; }
      67%  { transform: translate(-3px, -4px) rotate(-2deg); }
      77%  { transform: translate(1px, 3px) rotate(1deg); }
      82%  { transform: translate(-3px, -5px) rotate(-3deg); }
      89%  { transform: translate(4px, 3px) rotate(2deg); }
      95%  { transform: translate(-2px, -2px) rotate(-1deg); }
      100% { transform: translate(2px, 4px) rotate(2deg); }
    }
    @keyframes l7 {
      0%   { transform: translate(200px, -70px) rotate(-50deg); opacity:0.1; }
      14%  { opacity: 0.7; }
      58%  { transform: translate(-3px, -4px) rotate(-3deg); opacity:1; }
      68%  { transform: translate(4px, 3px) rotate(2deg); }
      78%  { transform: translate(-2px, -2px) rotate(-1deg); }
      83%  { transform: translate(3px, 5px) rotate(3deg); }
      90%  { transform: translate(-4px, -3px) rotate(-2deg); }
      96%  { transform: translate(2px, 4px) rotate(1deg); }
      100% { transform: translate(-1px, -5px) rotate(-2deg); }
    }
    @keyframes l8 {
      0%   { transform: translate(-280px, -40px) rotate(65deg); opacity:0.1; }
      16%  { opacity: 0.7; }
      59%  { transform: translate(4px, 3px) rotate(2deg); opacity:1; }
      69%  { transform: translate(-3px, -5px) rotate(-3deg); }
      79%  { transform: translate(1px, 4px) rotate(1deg); }
      84%  { transform: translate(-5px, -3px) rotate(-2deg); }
      91%  { transform: translate(3px, 5px) rotate(3deg); }
      97%  { transform: translate(-2px, -4px) rotate(-1deg); }
      100% { transform: translate(4px, 3px) rotate(2deg); }
    }
    @keyframes l9 {
      0%   { transform: translate(160px, 85px) rotate(-45deg); opacity:0.1; }
      18%  { opacity: 0.7; }
      60%  { transform: translate(-2px, -5px) rotate(-2deg); opacity:1; }
      70%  { transform: translate(3px, 4px) rotate(3deg); }
      80%  { transform: translate(-1px, -3px) rotate(-1deg); }
      85%  { transform: translate(4px, -4px) rotate(2deg); }
      92%  { transform: translate(-3px, 5px) rotate(-3deg); }
      98%  { transform: translate(1px, -3px) rotate(1deg); }
      100% { transform: translate(-2px, 4px) rotate(-2deg); }
    }
    @keyframes l10 {
      0%   { transform: translate(-190px, 75px) rotate(40deg); opacity:0.1; }
      20%  { opacity: 0.7; }
      60%  { transform: translate(3px, -4px) rotate(3deg); opacity:1; }
      70%  { transform: translate(-4px, 3px) rotate(-2deg); }
      80%  { transform: translate(2px, -2px) rotate(1deg); }
      85%  { transform: translate(-3px, 5px) rotate(-3deg); }
      92%  { transform: translate(4px, -4px) rotate(2deg); }
      98%  { transform: translate(-2px, 3px) rotate(-1deg); }
      100% { transform: translate(1px, -5px) rotate(2deg); }
    }
    @keyframes l11 {
      0%   { transform: translate(240px, -55px) rotate(-70deg); opacity:0.1; }
      8%   { opacity: 0.7; }
      56%  { transform: translate(-3px, 5px) rotate(-2deg); opacity:1; }
      66%  { transform: translate(2px, -4px) rotate(3deg); }
      76%  { transform: translate(-1px, 3px) rotate(-1deg); }
      81%  { transform: translate(4px, -5px) rotate(2deg); }
      88%  { transform: translate(-3px, 4px) rotate(-3deg); }
      94%  { transform: translate(2px, -3px) rotate(2deg); }
      100% { transform: translate(-1px, 5px) rotate(-1deg); }
    }
    @keyframes l12 {
      0%   { transform: translate(-220px, -65px) rotate(60deg); opacity:0.1; }
      10%  { opacity: 0.7; }
      57%  { transform: translate(4px, -3px) rotate(3deg); opacity:1; }
      67%  { transform: translate(-3px, 5px) rotate(-2deg); }
      77%  { transform: translate(2px, -2px) rotate(1deg); }
      82%  { transform: translate(-4px, 4px) rotate(-3deg); }
      89%  { transform: translate(3px, -5px) rotate(2deg); }
      95%  { transform: translate(-1px, 3px) rotate(-2deg); }
      100% { transform: translate(2px, -4px) rotate(1deg); }
    }
    @keyframes l13 {
      0%   { transform: translate(170px, 90px) rotate(-30deg); opacity:0.1; }
      12%  { opacity: 0.7; }
      58%  { transform: translate(-2px, 4px) rotate(-2deg); opacity:1; }
      68%  { transform: translate(3px, -5px) rotate(3deg); }
      78%  { transform: translate(-1px, 3px) rotate(-1deg); }
      83%  { transform: translate(5px, -4px) rotate(2deg); }
      90%  { transform: translate(-3px, 3px) rotate(-3deg); }
      96%  { transform: translate(2px, -2px) rotate(2deg); }
      100% { transform: translate(-2px, 4px) rotate(-1deg); }
    }
    @keyframes l14 {
      0%   { transform: translate(-260px, 65px) rotate(50deg); opacity:0.1; }
      14%  { opacity: 0.7; }
      59%  { transform: translate(3px, -4px) rotate(2deg); opacity:1; }
      69%  { transform: translate(-4px, 3px) rotate(-3deg); }
      79%  { transform: translate(2px, -1px) rotate(1deg); }
      84%  { transform: translate(-3px, 5px) rotate(-2deg); }
      91%  { transform: translate(4px, -3px) rotate(3deg); }
      97%  { transform: translate(-1px, 4px) rotate(-1deg); }
      100% { transform: translate(3px, -2px) rotate(2deg); }
    }
    @keyframes l15 {
      0%   { transform: translate(310px, -45px) rotate(-55deg); opacity:0.1; }
      8%   { opacity: 0.7; }
      56%  { transform: translate(-4px, 3px) rotate(-3deg); opacity:1; }
      66%  { transform: translate(3px, -5px) rotate(2deg); }
      76%  { transform: translate(-1px, 4px) rotate(-1deg); }
      81%  { transform: translate(5px, -3px) rotate(3deg); }
      88%  { transform: translate(-3px, 4px) rotate(-2deg); }
      94%  { transform: translate(2px, -4px) rotate(2deg); }
      100% { transform: translate(-2px, 3px) rotate(-3deg); }
    }
    @keyframes l16 {
      0%   { transform: translate(-140px, -85px) rotate(35deg); opacity:0.1; }
      10%  { opacity: 0.7; }
      57%  { transform: translate(2px, 5px) rotate(2deg); opacity:1; }
      67%  { transform: translate(-3px, -4px) rotate(-3deg); }
      77%  { transform: translate(1px, 3px) rotate(1deg); }
      82%  { transform: translate(-4px, -5px) rotate(-2deg); }
      89%  { transform: translate(3px, 4px) rotate(3deg); }
      95%  { transform: translate(-2px, -3px) rotate(-1deg); }
      100% { transform: translate(3px, 5px) rotate(2deg); }
    }
    @keyframes l17 {
      0%   { transform: translate(190px, 80px) rotate(-42deg); opacity:0.1; }
      12%  { opacity: 0.7; }
      58%  { transform: translate(-3px, -4px) rotate(-2deg); opacity:1; }
      68%  { transform: translate(4px, 3px) rotate(3deg); }
      78%  { transform: translate(-1px, -2px) rotate(-1deg); }
      83%  { transform: translate(3px, 5px) rotate(2deg); }
      90%  { transform: translate(-4px, -4px) rotate(-3deg); }
      96%  { transform: translate(2px, 3px) rotate(2deg); }
      100% { transform: translate(-2px, -5px) rotate(-1deg); }
    }
    @keyframes l18 {
      0%   { transform: translate(-300px, -30px) rotate(68deg); opacity:0.1; }
      14%  { opacity: 0.7; }
      59%  { transform: translate(4px, -3px) rotate(3deg); opacity:1; }
      69%  { transform: translate(-3px, 5px) rotate(-2deg); }
      79%  { transform: translate(2px, -3px) rotate(1deg); }
      84%  { transform: translate(-5px, 4px) rotate(-3deg); }
      91%  { transform: translate(3px, -5px) rotate(2deg); }
      97%  { transform: translate(-2px, 3px) rotate(-2deg); }
      100% { transform: translate(4px, -4px) rotate(3deg); }
    }
    @keyframes l19 {
      0%   { transform: translate(250px, -75px) rotate(-38deg); opacity:0.1; }
      16%  { opacity: 0.7; }
      60%  { transform: translate(-2px, 5px) rotate(-2deg); opacity:1; }
      70%  { transform: translate(3px, -4px) rotate(3deg); }
      80%  { transform: translate(-1px, 3px) rotate(-1deg); }
      85%  { transform: translate(4px, -5px) rotate(2deg); }
      92%  { transform: translate(-3px, 4px) rotate(-3deg); }
      98%  { transform: translate(1px, -3px) rotate(2deg); }
      100% { transform: translate(-2px, 5px) rotate(-1deg); }
    }
    @keyframes l20 {
      0%   { transform: translate(-170px, 60px) rotate(48deg); opacity:0.1; }
      18%  { opacity: 0.7; }
      60%  { transform: translate(3px, -5px) rotate(2deg); opacity:1; }
      70%  { transform: translate(-4px, 4px) rotate(-3deg); }
      80%  { transform: translate(2px, -2px) rotate(1deg); }
      85%  { transform: translate(-3px, 5px) rotate(-2deg); }
      92%  { transform: translate(4px, -4px) rotate(3deg); }
      98%  { transform: translate(-1px, 3px) rotate(-1deg); }
      100% { transform: translate(2px, -5px) rotate(2deg); }
    }
    @keyframes l21 {
      0%   { transform: translate(130px, 88px) rotate(-58deg); opacity:0.1; }
      20%  { opacity: 0.7; }
      61%  { transform: translate(-3px, -4px) rotate(-3deg); opacity:1; }
      71%  { transform: translate(4px, 3px) rotate(2deg); }
      81%  { transform: translate(-2px, -2px) rotate(-1deg); }
      86%  { transform: translate(3px, 5px) rotate(3deg); }
      93%  { transform: translate(-4px, -4px) rotate(-2deg); }
      99%  { transform: translate(2px, 3px) rotate(1deg); }
      100% { transform: translate(-1px, -5px) rotate(-2deg); }
    }

    .l0  { animation: l0  7s ease-in-out infinite; animation-delay: 0.00s; transform-origin: 34px 115px; }
    .l1  { animation: l1  7s ease-in-out infinite; animation-delay: 0.12s; transform-origin: 64px 115px; }
    .l2  { animation: l2  7s ease-in-out infinite; animation-delay: 0.24s; transform-origin: 94px 115px; }
    .l3  { animation: l3  7s ease-in-out infinite; animation-delay: 0.36s; transform-origin: 112px 115px; }
    .l4  { animation: l4  7s ease-in-out infinite; animation-delay: 0.48s; transform-origin: 142px 115px; }
    .l5  { animation: l5  7s ease-in-out infinite; animation-delay: 0.60s; transform-origin: 155px 115px; }
    .l6  { animation: l6  7s ease-in-out infinite; animation-delay: 0.72s; transform-origin: 185px 115px; }
    .l7  { animation: l7  7s ease-in-out infinite; animation-delay: 0.84s; transform-origin: 222px 115px; }
    .l8  { animation: l8  7s ease-in-out infinite; animation-delay: 0.96s; transform-origin: 254px 115px; }
    .l9  { animation: l9  7s ease-in-out infinite; animation-delay: 1.08s; transform-origin: 280px 115px; }
    .l10 { animation: l10 7s ease-in-out infinite; animation-delay: 1.20s; transform-origin: 297px 115px; }
    .l11 { animation: l11 7s ease-in-out infinite; animation-delay: 1.32s; transform-origin: 334px 115px; }
    .l12 { animation: l12 7s ease-in-out infinite; animation-delay: 1.44s; transform-origin: 347px 115px; }
    .l13 { animation: l13 7s ease-in-out infinite; animation-delay: 1.56s; transform-origin: 377px 115px; }
    .l14 { animation: l14 7s ease-in-out infinite; animation-delay: 1.68s; transform-origin: 394px 115px; }
    .l15 { animation: l15 7s ease-in-out infinite; animation-delay: 1.80s; transform-origin: 432px 115px; }
    .l16 { animation: l16 7s ease-in-out infinite; animation-delay: 1.92s; transform-origin: 445px 115px; }
    .l17 { animation: l17 7s ease-in-out infinite; animation-delay: 2.04s; transform-origin: 475px 115px; }
    .l18 { animation: l18 7s ease-in-out infinite; animation-delay: 2.16s; transform-origin: 499px 115px; }
    .l19 { animation: l19 7s ease-in-out infinite; animation-delay: 2.28s; transform-origin: 512px 115px; }
    .l20 { animation: l20 7s ease-in-out infinite; animation-delay: 2.40s; transform-origin: 540px 115px; }
    .l21 { animation: l21 7s ease-in-out infinite; animation-delay: 2.52s; transform-origin: 570px 115px; }
  </style>

  <rect width="680" height="200" rx="12" fill="url(#bg)"/>
  <!-- decorative wave -->
  <path d="M0 140 Q170 110 340 135 Q510 160 680 130 L680 200 L0 200 Z" fill="url(#wave)"/>

  <text class="letter l0"  x="34"  y="115">T</text>
  <text class="letter l1"  x="64"  y="115">u</text>
  <text class="letter l2"  x="94"  y="115">r</text>
  <text class="letter l3"  x="112" y="115">n</text>
  <text class="letter l4"  x="142" y="115">i</text>
  <text class="letter l5"  x="155" y="115">n</text>
  <text class="letter l6"  x="185" y="115">g</text>
  <text class="letter l7"  x="222" y="115">D</text>
  <text class="letter l8"  x="254" y="115">a</text>
  <text class="letter l9"  x="280" y="115">t</text>
  <text class="letter l10" x="297" y="115">a</text>
  <text class="letter l11" x="334" y="115">I</text>
  <text class="letter l12" x="347" y="115">n</text>
  <text class="letter l13" x="377" y="115">t</text>
  <text class="letter l14" x="394" y="115">o</text>
  <text class="letter l15" x="432" y="115">I</text>
  <text class="letter l16" x="445" y="115">n</text>
  <text class="letter l17" x="475" y="115">s</text>
  <text class="letter l18" x="499" y="115">i</text>
  <text class="letter l19" x="512" y="115">g</text>
  <text class="letter l20" x="540" y="115">h</text>
  <text class="letter l21" x="570" y="115">t</text>
</svg>
